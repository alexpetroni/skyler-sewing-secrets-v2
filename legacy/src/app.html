<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" sizes="32x32" href="https://skyler-storage.b-cdn.net/logo/logo-white.png?width=32" />
		<link rel="icon" type="image/png" sizes="16x16" href="https://skyler-storage.b-cdn.net/logo/logo-white.png?width=16" />
		<link rel="apple-touch-icon" href="https://skyler-storage.b-cdn.net/logo/logo-white.png?width=180" />
		
		<meta name="theme-color" content="#fdfbf7" />

		<!-- Cormorant Garamond (editorial display) + Plus Jakarta Sans (UI) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full bg-ivory-50 text-charcoal-700 antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
